<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Roadlog</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#3b82f6;--accent-hover:#2563eb}
[data-theme="light"]{--bg:#f8fafc;--surface:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--accent:#2563eb;--accent-hover:#1d4ed8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;background:var(--bg);color:var(--text);line-height:1.55;transition:background .3s,color .3s}
.container{max-width:600px;margin:0 auto;padding:1rem}
h1{font-size:1.4rem;margin-bottom:1rem;letter-spacing:-.01em}h2{font-size:1.1rem;margin-bottom:.75rem;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--border);border-radius:.45rem;padding:1rem;margin-bottom:.75rem;cursor:pointer;transition:border-color .2s,background .3s}
.card:hover{border-color:var(--accent)}
.btn{display:inline-block;padding:.6rem 1.2rem;border-radius:.4rem;border:none;font-size:.9rem;font-weight:500;cursor:pointer;text-decoration:none;transition:background .2s;color:white}
.btn-primary{background:var(--accent)}.btn-primary:hover{background:var(--accent-hover)}
.btn-block{display:block;width:100%;text-align:center}
.btn-sm{padding:.4rem .8rem;font-size:.8rem}
.form-group{margin-bottom:1rem}.form-group label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
.form-group input,.form-group select{width:100%;padding:.6rem;border-radius:.5rem;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;transition:background .3s,color .3s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent)}
input[type="datetime-local"]::-webkit-calendar-picker-indicator{filter:invert(0.7);cursor:pointer;padding:.25rem}
input[type="datetime-local"]{cursor:pointer}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.7);cursor:pointer;padding:.25rem}
input[type="date"]{cursor:pointer}
.prefill-hint{font-size:.75rem;color:var(--muted);margin-top:.2rem;font-style:italic}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:.75rem;padding:.75rem;text-align:center;transition:background .3s}
.stat-card .value{font-size:1.3rem;font-weight:700;color:var(--accent)}.stat-card .label{font-size:.75rem;color:var(--muted)}
/* Compact dashboard summary strip */
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;padding:1rem 1.15rem;margin-bottom:1rem}
.summary .hero{display:flex;flex-direction:column;gap:.15rem}
.summary .hero .big{font-size:1.7rem;font-weight:700;line-height:1;color:var(--text);letter-spacing:-.02em}
.summary .hero .sub{font-size:.72rem;color:var(--muted)}
.summary .mini{display:flex;gap:1.25rem;margin-left:auto;flex-wrap:wrap}
.summary .mini .m{display:flex;flex-direction:column;gap:.1rem;min-width:60px}
.summary .mini .m .mv{font-size:1.05rem;font-weight:700}
.summary .mini .m .ml{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.summary .mini .m .mv.fuel{color:#3b82f6}.summary .mini .m .mv.exp{color:#10b981}
/* Chart card + grouped bars */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:.5rem;padding:1rem 1.15rem;margin-bottom:1rem}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.85rem;flex-wrap:wrap}
.chart-head h3{font-size:1rem}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:.5rem;overflow:hidden}
.seg button{background:none;border:none;color:var(--muted);padding:.3rem .7rem;font-size:.8rem;cursor:pointer;transition:all .2s}
.seg button.on{background:var(--accent);color:#fff}
.veh-legend{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.85rem}
.veh-chip{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .55rem;background:var(--bg);border:1px solid var(--border);border-radius:.45rem;cursor:pointer;font-size:.78rem;transition:opacity .2s;user-select:none}
.veh-chip.off{opacity:.4}
.veh-chip.off strong{text-decoration:line-through}
.veh-chip .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chart-bars{display:flex;align-items:flex-end;gap:.6rem;overflow-x:auto;padding-bottom:.25rem}
.month-col{flex:1;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.bar-group{display:flex;align-items:flex-end;justify-content:center;gap:3px;width:100%;height:150px}
.gbar{flex:1;max-width:24px;border-radius:5px 5px 0 0;transition:height .35s ease,opacity .2s;position:relative}
.gbar:hover{opacity:.82}
.gbar-val{position:absolute;bottom:calc(100% + 4px);left:50%;writing-mode:vertical-rl;transform:translateX(-50%) rotate(180deg);font-size:.56rem;color:var(--muted);white-space:nowrap;font-weight:600;pointer-events:none}
.month-lbl{font-size:.68rem;color:var(--muted);white-space:nowrap}
.chart-foot{text-align:right;font-size:.8rem;color:var(--muted);margin-top:.6rem}
.chart-sub{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.6rem;min-height:1.9rem}
.chart-ctrls{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.cog-wrap{position:relative;display:inline-block}
.cog-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:.4rem;padding:.28rem .5rem;cursor:pointer;font-size:.9rem;line-height:1}
.cog-btn:hover{color:var(--text)}
.cog-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.cog-btn.active::after{content:'';position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#f59e0b;border:1px solid var(--surface)}
.cog-wrap>.cog-btn{position:relative}
.cog-menu{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:60;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;box-shadow:0 6px 20px rgba(0,0,0,.35);padding:.35rem}
.cog-wrap.open .cog-menu{display:block}
.cog-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:.35rem .5rem .2rem}
.cog-opt{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:.4rem .5rem;border-radius:.35rem;cursor:pointer;font-size:.85rem}
.cog-opt:hover{background:var(--bg)}
.cog-opt.on{color:var(--accent);font-weight:600}
.cog-sep{height:1px;background:var(--border);margin:.3rem 0}
.seg.mini button{font-size:.72rem;padding:.22rem .5rem}
.linkbtn{background:none;border:none;color:var(--muted);font-size:.75rem;cursor:pointer;padding:.2rem .3rem;border-radius:.3rem}
.linkbtn:hover{color:var(--accent)}
.bar-group{border-bottom:1px solid var(--border)}
.gbar.zero{opacity:.22}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.back{color:var(--muted);text-decoration:none;font-size:.9rem;cursor:pointer;background:none;border:none}.back:hover{color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:2rem}
.error{color:#ef4444;font-size:.85rem;margin-bottom:.5rem}
.link{color:var(--accent);cursor:pointer;background:none;border:none;font-size:.85rem}
.nav{display:flex;gap:.5rem;margin-bottom:1rem;border-bottom:1px solid var(--border);padding-bottom:.5rem}
.nav button{background:none;border:none;color:var(--muted);padding:.4rem .8rem;border-radius:.4rem;cursor:pointer;font-size:.85rem}
.nav button.active{background:var(--accent);color:white}
.toggle{position:relative;width:44px;height:24px;background:var(--border);border-radius:12px;cursor:pointer;border:none;transition:background .3s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:white;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border:none}
.monthly-bar{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem}
.monthly-bar .bar{flex:1;height:24px;background:var(--border);border-radius:4px;overflow:hidden}
.monthly-bar .bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.monthly-bar .month-label{width:60px;font-size:.8rem;color:var(--muted)}
.monthly-bar .month-value{width:60px;font-size:.8rem;text-align:right}
.dropdown-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:10;max-height:180px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.dropdown-item{display:flex;justify-content:space-between;align-items:center;padding:.6rem .75rem;cursor:pointer;transition:background .15s}
.dropdown-item:hover{background:var(--border)}
.dropdown-item+.dropdown-item{border-top:1px solid var(--border)}
.dropdown-item .del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:.2rem .4rem;border-radius:.25rem}
.dropdown-item .del-btn:hover{color:#ef4444;background:rgba(239,68,68,.1)}
.dropdown-add{padding:.6rem .75rem;cursor:pointer;color:var(--accent);font-weight:500;border-top:1px solid var(--border);transition:background .15s}
.dropdown-add:hover{background:var(--border)}
.period-toggle{display:flex;gap:.25rem;margin-bottom:1rem;flex-wrap:wrap}
.period-toggle button{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:.35rem .7rem;border-radius:.4rem;cursor:pointer;font-size:.8rem;transition:all .2s}
.period-toggle button.active{background:var(--accent);color:white;border-color:var(--accent)}
.chart-section{margin-bottom:1.5rem}
.chart-section h3{font-size:.9rem;color:var(--muted);margin-bottom:.5rem}
.chart-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem;font-size:.8rem}
.chart-row .chart-label{width:90px;color:var(--muted);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem}
.chart-row .chart-bar{flex:1;height:20px;background:var(--border);border-radius:3px;overflow:hidden}
.chart-row .chart-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.chart-row .chart-val{width:55px;text-align:right;flex-shrink:0}
.line-chart{position:relative;height:120px;border-left:1px solid var(--border);border-bottom:1px solid var(--border);margin:0 0 .5rem 40px;display:flex;align-items:flex-end}
.line-chart .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}
.line-chart .line-bar{flex:1;background:var(--accent);border-radius:2px 2px 0 0;margin:0 1px;min-width:4px;transition:height .3s;opacity:.7}
.line-chart .line-bar:hover{opacity:1}
.chart-legend{display:flex;gap:.5rem;font-size:.75rem;color:var(--muted);margin-bottom:.25rem;flex-wrap:wrap}
.vehicle-filter{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.vehicle-filter button{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:.3rem .6rem;border-radius:.4rem;cursor:pointer;font-size:.78rem}
.vehicle-filter button.active{background:var(--accent);color:white;border-color:var(--accent)}
.period-select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:.4rem;padding:.4rem .6rem;font-size:.85rem;cursor:pointer;appearance:auto}
.vbar-chart{display:flex;align-items:flex-end;gap:2px;height:140px;padding:0 .25rem;margin-bottom:.25rem;border-bottom:1px solid var(--border);overflow:hidden}
.vbar-chart .vbar{flex:1;min-width:20px;background:var(--accent);border-radius:3px 3px 0 0;transition:height .3s;position:relative;cursor:default;opacity:.8}
.vbar-chart .vbar:hover{opacity:1}
.vbar-chart .vbar:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:.3rem;padding:.2rem .4rem;font-size:.7rem;white-space:nowrap;color:var(--text);z-index:5}
.vbar-labels{display:flex;gap:4px;padding:0 .25rem}
.vbar-labels span{flex:1;min-width:20px;text-align:center;font-size:.65rem;color:var(--muted)}
.bar-tip{position:relative;cursor:default}
/* Floating tooltip (never clipped by chart overflow) */
#tip{position:fixed;display:none;background:var(--text);color:var(--bg);border-radius:.35rem;padding:.3rem .55rem;font-size:.72rem;white-space:nowrap;z-index:2000;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}
/* Desktop layout: left sidebar nav + wider content. Applied when body has .vm-desktop, which JS
   sets from the view-mode toggle (Auto follows width >=900px; Mobile/Desktop force it). */
.nav-brand{display:none}
body.vm-desktop .nav{position:fixed;left:0;top:0;bottom:0;width:190px;flex-direction:column;align-items:stretch;gap:.25rem;margin:0;padding:1rem .75rem;border-bottom:none;border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;z-index:50}
body.vm-desktop .nav-brand{display:block;font-size:1.15rem;font-weight:800;padding:.4rem .6rem 1rem}
.nav-actions{margin-left:auto;display:inline-flex;gap:.4rem;align-items:center}
body.vm-desktop .nav button{text-align:left;width:100%;padding:.55rem .7rem;font-size:.9rem}
body.vm-desktop .nav-actions{margin-left:0;margin-top:auto;flex-direction:row}
body.vm-desktop .nav-actions button{width:auto}
body.vm-desktop .container{max-width:1080px}
body.vm-desktop .container:has(> .nav){padding-left:calc(190px + 2.5rem);padding-right:2rem;max-width:1240px}
body.vm-desktop .summary .hero .big{font-size:1.85rem}
body.vm-desktop .bar-group{height:200px}
body.vm-desktop .stats{grid-template-columns:repeat(4,1fr)}
/* Collapsible settings sections */
.card.sect>h2{cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.card.sect>h2::after{content:'▸';color:var(--muted);font-size:.85rem;transition:transform .2s}
.card.sect:not(.collapsed)>h2::after{transform:rotate(90deg)}
.card.sect.collapsed>*:not(h2){display:none!important}
.card.sect.collapsed>h2{margin-bottom:0!important}
/* History filter bar + rows */
.filter-bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.filter-bar .fgrp{display:flex;flex-direction:column;gap:.2rem}
.filter-bar .fgrp>label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.date-range{display:inline-flex;align-items:center;gap:.4rem;background:var(--bg);border:1px solid var(--border);border-radius:.5rem;padding:.15rem .5rem}
.date-range input{border:none;background:none;color:var(--text);font-size:.85rem}
.date-range span{color:var(--muted)}
.cchip{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .55rem;background:var(--bg);border:1px solid var(--border);border-radius:.45rem;cursor:pointer;font-size:.78rem;user-select:none;transition:all .15s}
.cchip.off{opacity:.4}
.cchip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.hist-row{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;cursor:pointer}
.hist-row:hover{border-color:var(--accent)}
.fab-container{position:fixed;bottom:1.5rem;right:1.5rem;z-index:100;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:.5rem}
.fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .2s}
.fab-container.open .fab{transform:rotate(45deg)}
.fab-menu{display:none;flex-direction:column;gap:.5rem;margin-bottom:.5rem}
.fab-container.open .fab-menu{display:flex}
.fab-item{padding:.5rem 1rem;border-radius:2rem;border:none;color:#fff;font-size:.85rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);white-space:nowrap}
</style>

<body>
<div class="container" id="app"></div>
<script>
let token=localStorage.getItem('roadlog_token');
let theme=localStorage.getItem('roadlog_theme')||'auto';
function effectiveTheme(){return theme==='auto'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme;}
function applyTheme(){document.documentElement.setAttribute('data-theme',effectiveTheme());}
function themeIcon(){return theme==='auto'?'🌗':theme==='light'?'☀️':'🌙';}
function themeLabel(){return theme==='auto'?'Auto (follows system)':theme==='light'?'Light':'Dark';}
applyTheme();
// Live-update when the OS theme changes, but only while we're in 'auto' mode.
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(theme==='auto'){applyTheme();if(document.getElementById('app'))render();}});
// View mode: auto (follow width), mobile, or desktop (forces the sidebar layout).
let viewMode=localStorage.getItem('roadlog_viewmode')||'auto';
function effectiveDesktop(){return viewMode==='desktop'||(viewMode==='auto'&&window.innerWidth>=900);}
function applyViewMode(){document.body.classList.toggle('vm-desktop',effectiveDesktop());}
function viewIcon(){return viewMode==='auto'?'🔄':viewMode==='mobile'?'📱':'🖥️';}
function viewLabel(){return viewMode==='auto'?'Auto (by width)':viewMode==='mobile'?'Mobile':'Desktop';}
function toggleViewMode(){viewMode=viewMode==='auto'?'mobile':viewMode==='mobile'?'desktop':'auto';localStorage.setItem('roadlog_viewmode',viewMode);applyViewMode();render();}
applyViewMode();
window.addEventListener('resize',()=>{if(viewMode==='auto'){const was=document.body.classList.contains('vm-desktop');applyViewMode();if(was!==document.body.classList.contains('vm-desktop')&&document.getElementById('app'))render();}});

const currencies={EUR:'€',USD:'$',GBP:'£',CZK:'Kč',PLN:'zł',CHF:'CHF',SEK:'kr',NOK:'kr',DKK:'kr',HUF:'Ft'};
let curr='€';
let volUnit='L';
let distUnit='km';
let dateFmt='DD/MM/YYYY';
const MONTHS_ABBR=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatDate(d){
  const dt=(d instanceof Date)?d:new Date(d);
  if(isNaN(dt.getTime()))return '';
  const dd=String(dt.getDate()).padStart(2,'0'),mm=String(dt.getMonth()+1).padStart(2,'0'),yyyy=dt.getFullYear(),yy=String(yyyy).slice(-2),mon=MONTHS_ABBR[dt.getMonth()];
  switch(dateFmt){
    case 'MM/DD/YYYY':return mm+'/'+dd+'/'+yyyy;
    case 'YYYY-MM-DD':return yyyy+'-'+mm+'-'+dd;
    case 'DD-MM-YYYY':return dd+'-'+mm+'-'+yyyy;
    case 'DD.MM.YYYY':return dd+'.'+mm+'.'+yyyy;
    case 'DD MMM YYYY':return dd+' '+mon+' '+yyyy;
    case 'DD/MM/YY':return dd+'/'+mm+'/'+yy;
    default:return dd+'/'+mm+'/'+yyyy;
  }
}
// Local "YYYY-MM-DDTHH:mm" for datetime-local inputs (browser-local, not UTC).
function localDT(d){d=d?new Date(d):new Date();if(isNaN(d.getTime()))d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
// Format a chart bucket key for tooltips: a full date (daily) honors the date-format setting; a
// month key (YYYY-MM) shows "Mon YYYY".
function formatBucket(key,daily){
  if(!key)return '';
  if(daily||key.length>7)return formatDate(key);
  const y=key.slice(0,4),m=+key.slice(5,7);
  return (MONTHS_ABBR[m-1]||'')+' '+y;
}

let state={page:token?'dashboard':'login',vehicles:[],vehicleId:null,fillups:[],stats:null,prefill:null,dashboard:null,settings:null,users:[]};

async function api(p,o={}){
  const headers={'Content-Type':'application/json'};
  if(token)headers['Authorization']='Bearer '+token;
  const r=await fetch('/api'+p,{headers,...o});
  if(r.status===401&&token){token=null;localStorage.removeItem('roadlog_token');state.page='login';render();return null}
  if(r.status===204)return null;
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||'Request failed');
  return data;
}

function toggleTheme(){
  theme=theme==='auto'?'light':theme==='light'?'dark':'auto';
  localStorage.setItem('roadlog_theme',theme);
  applyTheme();
  render();
}
function toggleDashVehicle(id){
  if(!state.hiddenVehicles)state.hiddenVehicles=[];
  const i=state.hiddenVehicles.indexOf(id);
  if(i>=0)state.hiddenVehicles.splice(i,1);else state.hiddenVehicles.push(id);
  render();
}
function resetDashFilters(){
  state.hiddenVehicles=[];state.dashCostType='all';state.dashMetric='cost';
  render();
}
function clearHistoryFilters(){
  state.hfType='all';state.hfHiddenCars=[];state.hfHiddenStations=[];state.hfMinPrice='';state.hfMaxPrice='';state.hfFrom='';state.hfTo='';
  render();
}
function toggleHistCar(id){
  if(!state.hfHiddenCars)state.hfHiddenCars=[];
  const i=state.hfHiddenCars.indexOf(id);
  if(i>=0)state.hfHiddenCars.splice(i,1);else state.hfHiddenCars.push(id);
  render();
}
function toggleHistStation(name){
  if(!state.hfHiddenStations)state.hfHiddenStations=[];
  const i=state.hfHiddenStations.indexOf(name);
  if(i>=0)state.hfHiddenStations.splice(i,1);else state.hfHiddenStations.push(name);
  render();
}
// Make each Settings section card collapsible (first one open, rest collapsed to keep the page compact).
function wireSettingsCollapse(){
  document.querySelectorAll('#app > .card').forEach((card,idx)=>{
    const h=card.querySelector(':scope > h2');
    if(!h)return;
    card.classList.add('sect');
    if(idx>0)card.classList.add('collapsed');

function fuelUnit(fuelType,subType){

  if(fuelType==='CNG')return{unit:'kg',pricePlaceholder:'1.20',fullLabel:'Full tank',consumption:`kg/100${d}`,amountLabel:'kg filled'};
  const u=volUnit||'L';const cons=u==='gal'?'MPG':`${u}/100${d}`;
  return{unit:u,pricePlaceholder:u==='gal'?'3.50':'1.459',fullLabel:'Full tank',consumption:cons,amountLabel:u==='gal'?'Gallons filled':'Liters filled'};

function getPeriodRange(period){
  const now=new Date();
  const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(period==='month'){
    return{from:fmt(new Date(now.getFullYear(),now.getMonth(),1)),to:fmt(now)};
  }
  if(period==='lastmonth'){
    return{from:fmt(new Date(now.getFullYear(),now.getMonth()-1,1)),to:fmt(new Date(now.getFullYear(),now.getMonth(),0))};
  }
  if(period==='30days'){
    const d=new Date(now);d.setDate(d.getDate()-30);
    return{from:fmt(d),to:fmt(now)};
  }
  if(period==='last3months'){
    return{from:fmt(new Date(now.getFullYear(),now.getMonth()-2,1)),to:fmt(now)};
  }
  if(period==='last6months'){
    return{from:fmt(new Date(now.getFullYear(),now.getMonth()-5,1)),to:fmt(now)};
  }
  if(period==='year'){
    return{from:fmt(new Date(now.getFullYear(),0,1)),to:fmt(now)};
  }
  if(period==='lastyear'){
    return{from:fmt(new Date(now.getFullYear()-1,0,1)),to:fmt(new Date(now.getFullYear()-1,11,31))};
  }
  if(period==='custom'){
    const f=state.page==='detail'?state.vCustomFrom:state.customFrom;
    const t=state.page==='detail'?state.vCustomTo:state.customTo;
    if(f&&t)return{from:f,to:t};
  }
  return null;
}
// Contiguous list of YYYY-MM keys from fromKey..toKey inclusive (so empty months aren't skipped).
function monthRange(fromKey,toKey){
  const out=[];if(!fromKey||!toKey)return out;
  let y=+fromKey.slice(0,4),m=+fromKey.slice(5,7);const ty=+toKey.slice(0,4),tm=+toKey.slice(5,7);
  while(y<ty||(y===ty&&m<=tm)){out.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++;}if(out.length>120)break;}
  return out;
}
// Contiguous list of YYYY-MM-DD keys from fromDate..toDate inclusive (for the day view).
function dayRange(fromDate,toDate){
  const out=[];if(!fromDate||!toDate)return out;
  let d=new Date(fromDate+'T00:00:00'),end=new Date(toDate+'T00:00:00'),n=0;
  while(d<=end&&n<400){out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));d.setDate(d.getDate()+1);n++;}
  return out;
}
// Single-series bucketed bar chart (same discrete look as the dashboard). points: [{date, [valKey]}].
// agg 'avg'|'sum'; fmtVal(v)->label string. daily=true buckets by day else month.
function bucketChart(points,valKey,agg,color,fmtVal,from,to,daily){
  if(!from||!to)return '<p class="empty">No data.</p>';
  const groups={};
  points.forEach(p=>{const val=p[valKey];if(!(val>0))return;const k=daily?p.date.slice(0,10):p.date.slice(0,7);if(!groups[k])groups[k]={sum:0,n:0};groups[k].sum+=val;groups[k].n++;});
  const keys=daily?dayRange(from,to):monthRange(from.slice(0,7),to.slice(0,7));
  const vals=keys.map(k=>{const g=groups[k];if(!g)return 0;return agg==='avg'?g.sum/g.n:g.sum;});
  const max=Math.max.apply(null,vals.concat(0.0001));
  const bars=keys.map((k,i)=>{
    const v=vals[i],h=(v/max*72).toFixed(1);
    const lbl=daily?(k.slice(8)+'/'+k.slice(5,7)):(k.slice(5)+'/'+k.slice(2,4));
    const vl=v>0?fmtVal(v):'';
    return '<div class="month-col"><div class="bar-group"><div class="gbar bar-tip'+(v>0?'':' zero')+'" style="height:'+h+'%;background:'+color+';min-height:'+(v>0?'3px':'2px')+'" data-tip="'+formatBucket(k,daily)+': '+(v>0?fmtVal(v):'—')+'">'+(vl?'<span class="gbar-val">'+vl+'</span>':'')+'</div></div><div class="month-lbl">'+lbl+'</div></div>';
  }).join('');
  return '<div class="chart-bars">'+bars+'</div>';
}

async function toggleSetting(key){
  state.settings[key]=!state.settings[key];
  await api('/settings',{method:'PUT',body:JSON.stringify(state.settings)});
  render();
}
async function changeCurrency(val){
  state.settings.currency=val;curr=currencies[val]||val;
  await api('/settings',{method:'PUT',body:JSON.stringify(state.settings)});
  render();
}
async function changeVolumeUnit(val){
  state.settings.volumeUnit=val;
  await api('/settings',{method:'PUT',body:JSON.stringify(state.settings)});
  render();
}
async function changeDistanceUnit(val){
  state.settings.distanceUnit=val;distUnit=val;
  await api('/settings',{method:'PUT',body:JSON.stringify(state.settings)});
  render();
}
async function changeTZ(val){
  state.settings.timezone=val;
  await api('/settings',{method:'PUT',body:JSON.stringify(state.settings)});
}
async function changeDateFormat(val){
  state.settings.dateFormat=val;dateFmt=val;
  await api('/settings',{method:'PUT',body:JSON.stringify(state.settings)});
  render();
}
async function renameStation(id){
  const st=state.allStations.find(s=>s.id===id);
  const name=prompt('Rename station:',st?st.name:'');
  if(name&&name!==st.name){
    await api(`/stations/${id}`,{method:'DELETE'});
    await api('/stations',{method:'POST',body:JSON.stringify({name:name,fuelType:st.fuelType})});
    render();
  }
}
async function delStation(id){
  await api(`/stations/${id}`,{method:'DELETE'});
  render();
}
async function addStationFromSettings(){
  const name=document.getElementById('new_st_name').value.trim();
  const fuelType=document.getElementById('new_st_fuel').value;
  if(!name)return;
  await api('/stations',{method:'POST',body:JSON.stringify({name,fuelType})});
  render();
}

function showErr(msg){const el=document.getElementById('err');if(el)el.innerHTML=`<div class="error">${msg}</div>`}

async function doLogin(e){
  e.preventDefault();
  try{
    const res=await api('/login',{method:'POST',body:JSON.stringify({email:document.getElementById('a_email').value,password:document.getElementById('a_pass').value})});
    token=res.token;localStorage.setItem('roadlog_token',token);state.page='dashboard';render();
  }catch(err){showErr(err.message)}
}

async function doRegister(e){
  e.preventDefault();
  try{
    const res=await api('/register',{method:'POST',body:JSON.stringify({name:document.getElementById('r_name').value,email:document.getElementById('r_email').value,password:document.getElementById('r_pass').value})});
    token=res.token;localStorage.setItem('roadlog_token',token);state.page='dashboard';render();
  }catch(err){showErr(err.message)}
}

function logout(){token=null;localStorage.removeItem('roadlog_token');state.page='login';render()}
function openVehicle(id){state.vehicleId=id;state.page='detail';render()}
function goFillup(){state.page='fillup';render()}
function switchPHEV(type){
  document.getElementById('f_phev_type').value=type;
  const fb=document.getElementById('phev_fuel'),eb=document.getElementById('phev_elec');
  if(type==='electric'){eb.className='btn btn-sm btn-primary';fb.className='btn btn-sm';fb.style.background='var(--border)';eb.style.background=''}
  else{fb.className='btn btn-sm btn-primary';eb.className='btn btn-sm';eb.style.background='var(--border)';fb.style.background=''}
  const u=fuelUnit('Plugin Hybrid',type);
  const fuelEl=document.getElementById('f_fuel');fuelEl.placeholder=u.amountLabel;
  fuelEl.parentElement.querySelector('label').textContent='Amount ('+u.unit+')';
  const priceEl=document.getElementById('f_price');priceEl.placeholder='e.g. '+u.pricePlaceholder;
  priceEl.parentElement.querySelector('label').textContent='Price per '+u.unit+' ('+curr+')';
  const fullRow=document.getElementById('f_full_btn');
  if(fullRow){fullRow.closest('.form-group').style.display=type==='electric'?'none':''}
  const missedRow=document.getElementById('f_missed_btn');
  if(missedRow){missedRow.closest('.form-group').style.display=type==='electric'?'none':''}
}
function parseNum(id){return +(document.getElementById(id).value.replace(',','.'))||0}
function calcTotal(){
  const el=document.getElementById('f_total');
  if(el.dataset.manual)return;
  const fuel=parseNum('f_fuel'),price=parseNum('f_price');
  el.value=fuel&&price?(fuel*price).toFixed(2):'';
}

let stationsList=[];
let stationsLoaded=false;
async function showStations(){
  const v=await api(`/vehicles/${state.vehicleId}`);
  stationsList=await api(`/stations?fuelType=${v.fuelType}`)||[];
  stationsLoaded=true;
  renderStationDropdown(true);
}
function filterStations(){
  if(!stationsLoaded)return;
  renderStationDropdown(false);
}
function renderStationDropdown(showAll){
  const dd=document.getElementById('station-dropdown');
  const val=document.getElementById('f_station').value.toLowerCase().trim();
  const filtered=showAll?stationsList:stationsList.filter(s=>s.name.toLowerCase().includes(val));
  dd.style.display='block';
  let html=filtered.map(s=>`<div class="dropdown-item" onmousedown="pickStation('${s.name.replace(/'/g,"\\'")}')" ><span>${s.name}</span><button class="del-btn" onmousedown="event.stopPropagation();removeStation(${s.id})">✕</button></div>`).join('');
  if(val&&!stationsList.find(s=>s.name.toLowerCase()===val)){
    html+=`<div class="dropdown-add" onmousedown="saveAndPickStation()">+ Save "${document.getElementById('f_station').value}"</div>`;
  }
  if(!html){dd.style.display='none';return}
  dd.innerHTML=html;
}
function pickStation(name){
  document.getElementById('f_station').value=name;
  document.getElementById('station-dropdown').style.display='none';
  applyStationPrice(name);
}
// When "Remember price per station" is on and the chosen (saved) station has a recorded last price
// for this vehicle, fill the price field from it. Only fires on an explicit pick from the dropdown.
function applyStationPrice(name){
  if(!(state.settings&&state.settings.prefillPricePerStation))return;
  if(!state.prefill||!state.prefill.stationPrices)return;
  const price=state.prefill.stationPrices[(name||'').toLowerCase().trim()];
  if(price==null)return;
  const el=document.getElementById('f_price');
  if(!el)return;
  el.value=price;
  const hint=el.parentElement.querySelector('.prefill-hint');
  if(hint)hint.textContent='Price from your last fill-up at '+name;
  if(typeof calcTotal==='function')calcTotal();
}
async function saveAndPickStation(){
  const name=document.getElementById('f_station').value;
  const v=await api(`/vehicles/${state.vehicleId}`);
  const saved=await api('/stations',{method:'POST',body:JSON.stringify({name:name,fuelType:v.fuelType})});
  stationsList.push(saved);
  document.getElementById('station-dropdown').style.display='none';
  applyStationPrice(name);
}
async function removeStation(id){
  await api(`/stations/${id}`,{method:'DELETE'});
  stationsList=stationsList.filter(s=>s.id!==id);
  renderStationDropdown(true);
}
function editVehicle(id){state.vehicleId=id;state.page='editVehicle';render()}
function goExpense(){state.page='addExpense';state.exRecurring=false;state.exPaid=true;state.exForm=null;render()}
function saveExForm(){state.exForm={date:document.getElementById('ex_date')?.value,amount:document.getElementById('ex_amount')?.value,cat:document.getElementById('ex_cat')?.value,notes:document.getElementById('ex_notes')?.value,interval:document.getElementById('ex_interval')?.value,due:document.getElementById('ex_due')?.value,notify:document.getElementById('ex_notify')?.value}}
async function submitExpense(e){
  e.preventDefault();
  const data={date:new Date(document.getElementById('ex_date').value).toISOString(),amount:+document.getElementById('ex_amount').value,category:document.getElementById('ex_cat').value,notes:document.getElementById('ex_notes').value};
  if(state.exRecurring){
    const interval=document.getElementById('ex_interval').value;
    data.recurring=true;data.interval=interval;data.notifyDaysBefore=+document.getElementById('ex_notify').value||7;

function paginator(pg,pages,key){
  const btn=(n,label,active)=>`<button class="btn btn-sm" style="background:${active?'var(--accent)':'var(--border)'};min-width:32px" onclick="state.${key}=${n};render()">${label||n}</button>`;
  let btns=[];
  btns.push(btn(Math.max(1,pg-1),'←'));
  btns.push(btn(1,1,pg===1));
  if(pg>3)btns.push('<span style="padding:0 .3rem;color:var(--muted)">…</span>');
  for(let i=Math.max(2,pg-1);i<=Math.min(pages-1,pg+1);i++)btns.push(btn(i,i,pg===i));
  if(pg<pages-2)btns.push('<span style="padding:0 .3rem;color:var(--muted)">…</span>');
  if(pages>1)btns.push(btn(pages,pages,pg===pages));
  btns.push(btn(Math.min(pages,pg+1),'→'));
  return '<div style="display:flex;justify-content:center;align-items:center;gap:.25rem;margin-top:.75rem">'+btns.join('')+'</div>';
}

  const r=await fetch('/api/backup',{headers:{'Authorization':'Bearer '+token}});
  const blob=await r.blob();
  const url=URL.createObjectURL(blob);
  const ts=new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
  const a=document.createElement('a');a.href=url;a.download=`roadlog-backup-${ts}.json`;a.click();URL.revokeObjectURL(url);
}

async function uploadCSV(){
  const file=document.getElementById('csv_file').files[0];
  if(!file)return;
  const text=await file.text();
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const parse=line=>{const r=[];let cur='',inQ=false;for(const ch of line){if(ch==='"'){inQ=!inQ}else if((ch===','||ch===';')&&!inQ){r.push(cur.trim());cur=''}else{cur+=ch}}r.push(cur.trim());return r};
  const headers=parse(lines[0]);
  const data=lines.slice(1).map(parse).filter(r=>r.length>=headers.length-1);
  state.csvHeaders=headers;
  state.csvPreview=data.slice(0,5);
  state.csvData=data;
  state.csvGuess=guessMapping(headers,data.slice(0,5));
  render();
}
function guessMapping(headers,preview){
  const guess={};
  const lh=headers.map(h=>h.toLowerCase());
  const patterns={date:/date|datum|time|when/i,odometer:/odo|km|mileage|kilo|mile|distance/i,fuelAmount:/fuel|amount|quantity|liter|litre|volume|kwh|gallon/i,pricePerUnit:/price.*unit|unit.*price|price.*l|€.*l|cost.*l/i,totalCost:/total|cost|paid|amount.*€|sum|price$/i,station:/station|place|location|gas|pump|where/i,notes:/note|comment|memo|remark/i,fullTank:/full|tank|complete/i,amount:/amount|cost|total|price|sum|paid/i,category:/category|type|kind|group/i};
  Object.entries(patterns).forEach(([field,re])=>{
    const idx=lh.findIndex(h=>re.test(h));
    if(idx>=0&&!Object.values(guess).includes(idx))guess[field]=idx;
  });
  // If totalCost and pricePerUnit both match same pattern, disambiguate by values
  if(!guess.pricePerUnit&&!guess.totalCost){
    lh.forEach((h,i)=>{
      if(/price|cost/i.test(h)&&!(i in Object.values(guess))){
        const vals=preview.map(r=>parseFloat((r[i]||'').replace(/[^0-9.,]/g,'').replace(',','.')));
        const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
        if(avg<10)guess.pricePerUnit=i;else guess.totalCost=i;
      }
    });
  }
  return guess;
}
function getMappingValue(field){
  const el=document.getElementById('map_'+field);
  return el?+el.value:-1;
}
function renderMappedPreview(){
  const fields=['date','odometer','fuelAmount','pricePerUnit','totalCost','station'];
  const mapping={};
  fields.forEach(f=>{const v=getMappingValue(f);if(v>=0)mapping[f]=v});
  const el=document.getElementById('import-preview');
  if(!el||!state.csvPreview)return;
  const rows=state.csvPreview.map(row=>{
    return '<tr>'+fields.map(f=>{
      const idx=mapping[f];
      return '<td style="padding:.3rem .5rem;border-bottom:1px solid var(--border);font-size:.8rem">'+(idx>=0?(row[idx]||'—'):'—')+'</td>';
    }).join('')+'</tr>';
  }).join('');
  el.innerHTML='<table style="border-collapse:collapse;width:100%"><tr>'+fields.map(f=>'<th style="padding:.3rem .5rem;border-bottom:1px solid var(--border);text-align:left;color:var(--accent);font-size:.75rem">'+f+'</th>').join('')+'</tr>'+rows+'</table>';
}
async function doImport(){
  const mapping={};
  ['date','odometer','fuelAmount','pricePerUnit','totalCost','station','fullTank','notes'].forEach(f=>{
    const v=+document.getElementById('map_'+f).value;
    if(v>=0)mapping[f]=v;
  });
  if(!('date' in mapping)||!('fuelAmount' in mapping)){alert('Date and Fuel Amount are required');return}
  // Validate: check first 5 rows for zero values in numeric fields
  const numFields=[{key:'odometer',label:'Odometer'},{key:'fuelAmount',label:'Fuel Amount'}];
  const warnings=[];
  numFields.forEach(f=>{
    if(!(f.key in mapping))return;
    const col=mapping[f.key];
    const zeros=state.csvData.slice(0,5).filter(row=>{
      const v=row[col]?row[col].replace(/[^0-9.,]/g,''):'';
      return !v||parseFloat(v.replace(',','.'))==0;
    }).length;
    if(zeros>=3)warnings.push(f.label+' column looks unparseable ('+zeros+'/5 rows are zero). Values look like: "'+state.csvData[0][col]+'". Units like "km", "Lt" are stripped automatically, but check if the mapping is correct.');
  });
  if(warnings.length&&!confirm('⚠️ Warning:\\n\\n'+warnings.join('\\n\\n')+'\\n\\nImport anyway?'))return;
  const dateFormat=document.getElementById('map_dateformat').value;
  const clearFirst=document.getElementById('import_clear').checked;
  if(clearFirst&&!confirm('This will DELETE all existing fill-ups for this vehicle before importing. Continue?'))return;
  const res=await api('/import',{method:'POST',body:JSON.stringify({vehicleId:state.vehicleId,mapping,dateFormat,clearFirst,data:state.csvData})});
  alert(`Imported ${res.imported} fill-ups`+(res.errors&&res.errors.length?`\n${res.errors.length} errors`:''));
  state.csvHeaders=null;state.csvData=null;
  openVehicle(state.vehicleId);
}

  fields.forEach(f=>{const el=document.getElementById('map_'+f);if(el&&+el.value>=0)mapping[f]=+el.value});

async function doRestore(input){
  const file=input.files[0];if(!file)return;
  if(!confirm('This will replace ALL data. Are you sure?'))return;
  const text=await file.text();
  try{
    const res=await api('/restore',{method:'POST',body:text});
    alert(`Restored: ${res.vehicles} vehicles, ${res.fillups} fill-ups, ${res.expenses||0} expenses`);
    render();
  }catch(err){alert('Restore failed: '+err.message)}
}

async function submitReminder(e){
  e.preventDefault();
  const data={title:document.getElementById('rem_title').value,notes:document.getElementById('rem_notes').value,repeatMonths:+document.getElementById('rem_rmonths').value||0,repeatKm:+document.getElementById('rem_rkm').value||0};
  const d=document.getElementById('rem_date').value;if(d)data.dueDate=new Date(d).toISOString();
  const o=+document.getElementById('rem_odo').value;if(o)data.dueOdometer=o;
  await api(`/vehicles/${state.vehicleId}/reminders`,{method:'POST',body:JSON.stringify(data)});
  loadRemindersSection();
}

async function markReminderDone(id){
  await api(`/reminders/${id}/done`,{method:'POST'});
  loadRemindersSection();
}

async function deleteReminder(id){
  if(confirm('Delete this reminder?')){await api(`/reminders/${id}`,{method:'DELETE'});loadRemindersSection()}

async function loadSettingsNotifications(){
  const el=document.getElementById('settings-notifications');if(!el)return;
  let items;try{items=await api('/notifications')}catch(e){return}
  let html=items.map(n=>{
    const cfg=JSON.parse(n.config||'{}');
    const info=n.type==='pushover'?'Token: '+cfg.token?.slice(0,6)+'… / User: '+cfg.user?.slice(0,6)+'…':'URL: '+cfg.url?.slice(0,30)+'…';
    return `<div class="setting-row"><div><strong>${n.type}</strong> <span style="font-size:.8rem;color:${n.enabled?'#10b981':'var(--muted)'}">${n.enabled?'✓ Enabled':'Disabled'}</span><div style="font-size:.75rem;color:var(--muted)">${info}</div></div><div style="display:flex;gap:.25rem"><button class="btn btn-sm" style="background:var(--border)" onclick="editNotifConfig(${n.id})">✏️</button><button class="btn btn-sm" style="background:#ef4444" onclick="deleteNotifConfig(${n.id})">✕</button></div></div>`;
  }).join('');
  html+=`<div style="margin-top:.5rem"><button class="btn btn-sm" style="background:var(--border)" onclick="showAddNotifConfig()">+ Add</button></div><div id="notif-form"></div>`;
  el.innerHTML=html;
}

  <div id="nc_fields">${n.type==='webhook'?'<div class="form-group"><label>Webhook URL</label><input id="nc_url" value="'+(cfg.url||'')+'" placeholder="https://..."></div>':'<div class="form-group"><label>App Token</label><input id="nc_token" value="'+(cfg.token||'')+'" placeholder="Pushover app token"></div><div class="form-group"><label>User Key</label><input id="nc_user" value="'+(cfg.user||'')+'" placeholder="Pushover user key"></div>'}</div>

async function editNotifConfig(id){
  const items=await api('/notifications');
  const n=items.find(x=>x.id===id);if(!n)return;
  showAddNotifConfig(n);
}

function toggleNotifFields(){
  const t=document.getElementById('nc_type').value;
  document.getElementById('nc_fields').innerHTML=t==='pushover'?
    '<div class="form-group"><label>App Token</label><input id="nc_token" placeholder="Pushover app token"></div><div class="form-group"><label>User Key</label><input id="nc_user" placeholder="Pushover user key"></div>':
    '<div class="form-group"><label>Webhook URL</label><input id="nc_url" placeholder="https://..."></div>';

  else config=JSON.stringify({url:document.getElementById('nc_url').value});

}

async function loadAutoBackup(){
  const el=document.getElementById('settings-autobackup');if(!el)return;
  let cfg;try{cfg=await api('/autobackup')}catch(e){return}
  const isWebdav=cfg.type==='webdav';
  el.innerHTML=`<div class="setting-row"><span>Enable auto-backup</span><button class="toggle ${cfg.enabled?'on':''}" id="ab_toggle" onclick="this.classList.toggle('on');saveAutoBackup()"></button></div>
  <div class="form-group" style="margin-top:.75rem"><label>Type</label><select id="ab_type" onchange="switchBackupType(this.value)"><option value="webdav" ${cfg.type==='webdav'?'selected':''}>WebDAV (Nextcloud)</option><option value="local" ${cfg.type==='local'?'selected':''}>Local Path</option></select></div>
  ${cfg.type==='webdav'?`<div class="form-group"><label>WebDAV URL</label><input id="ab_url" value="${cfg.url||''}" placeholder="https://cloud.example.com/remote.php/dav/files/user/Backups/"></div>

  <div class="form-group"><label>Password</label><input type="password" id="ab_pass" value="${cfg.password||''}"></div>`

  <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem">
    <button class="btn btn-sm btn-primary" onclick="saveAutoBackup()">Save</button>
    <button class="btn btn-sm" style="background:var(--border)" onclick="triggerBackup()">Run Now</button>
  </div>
  ${cfg.lastRun?`<p style="font-size:.8rem;color:var(--muted);margin-top:.5rem">Last: ${new Date(cfg.lastRun).toLocaleString()} — ${cfg.lastStatus==='ok'?'✅ OK':'❌ '+cfg.lastStatus}</p>`:''}`;
}

async function switchBackupType(type_){
  saveAutoBackup();
}

async function saveAutoBackup(){
  const type_=document.getElementById('ab_type').value;
  const sched=document.getElementById('ab_sched').value;
  const body={enabled:document.getElementById('ab_toggle').classList.contains('on'),type:type_,schedule:sched,time:document.getElementById('ab_time').value||'03:00',retain:+document.getElementById('ab_retain').value||7};
  if(sched==='weekly'){const wd=document.getElementById('ab_weekday');body.weekday=wd?+wd.value:1}
  if(sched==='monthly'){const dm=document.getElementById('ab_dom');body.dayOfMonth=dm?+dm.value:1}
  if(type_==='webdav'){body.url=document.getElementById('ab_url').value;body.username=document.getElementById('ab_user').value;body.password=document.getElementById('ab_pass').value}
  else{body.path=document.getElementById('ab_path').value}
  await api('/autobackup',{method:'PUT',body:JSON.stringify(body)});
  loadAutoBackup();
}

async function triggerBackup(){
  try{await api('/autobackup/trigger',{method:'POST'});alert('Backup completed!')}catch(e){alert('Backup failed: '+e.message)}
  loadAutoBackup();
}

async function loadAuditLog(offset=0){
  const el=document.getElementById('settings-audit');if(!el)return;
  let data;try{data=await api(`/audit?limit=20&offset=${offset}`)}catch(e){return}
  const entries=data.entries||[];
  let html=entries.map(e=>`<div style="padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.85rem"><span style="color:var(--accent)">${e.action}</span> ${e.entityType} <span style="color:var(--muted)">${e.details||''}</span>${e.vehicleName?' · <strong>'+e.vehicleName+'</strong>':''}<div style="font-size:.75rem;color:var(--muted)">${e.userName||'unknown'} · ${new Date(e.createdAt).toLocaleString()} · ${e.ip}</div></div>`).join('');
  if(!entries.length)html='<p class="empty">No activity yet.</p>';
  const total=data.total||0;
  if(total>20){
    html+=`<div style="display:flex;justify-content:center;gap:.5rem;margin-top:.75rem">`;
    if(offset>0)html+=`<button class="btn btn-sm" style="background:var(--border)" onclick="loadAuditLog(${offset-20})">← Prev</button>`;
    if(offset+20<total)html+=`<button class="btn btn-sm" style="background:var(--border)" onclick="loadAuditLog(${offset+20})">Next →</button>`;
    html+=`</div>`;
  }
  el.innerHTML=html;
}

// Floating tooltip for any [data-tip] element - not clipped by chart overflow or bar edges.
(function(){
  const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t)return;tip.textContent=t.getAttribute('data-tip');tip.style.display='block';});
  document.addEventListener('mousemove',e=>{if(tip.style.display!=='block')return;let x=e.clientX+14,y=e.clientY-34;const w=tip.offsetWidth;if(x+w>window.innerWidth-8)x=e.clientX-w-14;if(y<4)y=e.clientY+18;tip.style.left=x+'px';tip.style.top=y+'px';});
  document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)tip.style.display='none';});
})();

render().catch(e=>{document.getElementById('app').innerHTML='<pre style="color:red;padding:1rem">Error: '+e.message+'\n'+e.stack+'</pre>'});
